# Deprecated when Root Directory is empty — use repo root nixpacks.toml instead.
# If you must set Root Directory to apps/api, Railway cannot access package-lock.json.
# Remove Root Directory and set Config file path to apps/api/railway.json.

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build -w @vikela/api"]

[start]
cmd = "bash scripts/railway-start-api.sh"

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
NODE_ENV = "production"
PORT = "3001"
