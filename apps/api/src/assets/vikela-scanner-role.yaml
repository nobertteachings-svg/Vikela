AWSTemplateFormatVersion: "2010-09-09"
Description: Shieldoq cross-account scanner role (read-only SecurityAudit-style access)

Parameters:
  ShieldoqAccountId:
    Type: String
    Description: Shieldoq AWS account ID that will assume this role
  ExternalId:
    Type: String
    Description: External ID for secure AssumeRole (set AWS_EXTERNAL_ID in Shieldoq)
    Default: shieldoq-scanner

Resources:
  ShieldoqScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ShieldoqScanner
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${ShieldoqAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess

Outputs:
  RoleArn:
    Description: Paste this ARN into Shieldoq AWS integration
    Value: !GetAtt ShieldoqScannerRole.Arn
  ExternalId:
    Description: External ID configured on the trust policy
    Value: !Ref ExternalId
