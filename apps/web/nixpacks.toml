# Deprecated when Root Directory is empty — use repo root nixpacks.toml instead.
# Remove Root Directory and set Config file path to apps/web/railway.json.

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build -w @vikela/web"]

[start]
cmd = "npm run start -w @vikela/web"

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
NODE_ENV = "production"
PORT = "3000"
