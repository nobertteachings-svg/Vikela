name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run lint:security
      - run: npm run test
      - run: npm run test:coverage
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage/lcov.info,./apps/web/coverage/lcov.info
          fail_ci_if_error: false

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Start Postgres and Redis
        run: docker compose up -d postgres redis
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          exit 1
      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vikela
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
      - name: Start API and Web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vikela
          REDIS_URL: redis://localhost:6379
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          ALLOW_DEMO_INTEGRATIONS: "true"
          DISABLE_SCAN_WORKER: "true"
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health && curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 3
          done
          exit 1
      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_API_URL: http://localhost:3001
        run: npm run test:e2e
      - name: Run accessibility tests
        env:
          PLAYWRIGHT_API_URL: http://localhost:3001
        run: npm run test:a11y
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  performance:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Start services
        run: |
          docker compose up -d postgres redis
          sleep 5
          npm run db:generate
          npm run db:migrate
          npm run db:seed
          npm run dev &
          sleep 10
      - name: Run load tests
        env:
          API_URL: http://localhost:3001
        run: npm run test:performance
        continue-on-error: true
